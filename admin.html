<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e4e4e7;min-height:100vh}

/* Login */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#18181b;border:1px solid #27272a;border-radius:12px;padding:40px;width:340px}
.login-box h1{font-size:20px;margin-bottom:8px}
.login-box h1 span{color:#f97316}
.login-box p{color:#71717a;font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:10px 12px;background:#0a0a0a;border:1px solid #27272a;border-radius:8px;color:#e4e4e7;font-size:14px;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:#f97316}
.login-box button{width:100%;padding:10px;background:#f97316;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.login-box button:hover{background:#ea580c}
.login-error{color:#ef4444;font-size:13px;margin-bottom:12px;display:none}

/* Layout */
#app{display:none}
header{background:#18181b;border-bottom:1px solid #27272a;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:16px;font-weight:600}
header h1 span{color:#f97316}
.header-right{display:flex;align-items:center;gap:12px}
.jar-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.jar-badge.on{background:#22c55e20;color:#22c55e}
.jar-badge.off{background:#ef444420;color:#ef4444}
#headerStats{color:#71717a;font-size:12px}

/* Tabs */
.tabs{display:flex;gap:2px;padding:12px 24px 0;border-bottom:1px solid #27272a}
.tab{padding:8px 16px;background:none;border:none;color:#71717a;font-size:13px;font-weight:500;cursor:pointer;border-radius:8px 8px 0 0;transition:all .15s}
.tab:hover{color:#a1a1aa}
.tab.active{color:#f97316;background:#18181b}

/* Panels */
.panels{padding:20px 24px}
.panel{display:none}
.panel.active{display:block}

/* Cards */
.card{background:#18181b;border:1px solid #27272a;border-radius:10px;padding:16px 20px}
.card h3{font-size:13px;color:#71717a;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#18181b;border:1px solid #27272a;border-radius:10px;padding:16px 20px}
.stat-card .label{font-size:12px;color:#71717a;margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.orange{color:#f97316}
.stat-card .value.green{color:#22c55e}

/* Table */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.toolbar input{flex:1;max-width:280px;padding:7px 12px;background:#0a0a0a;border:1px solid #27272a;border-radius:8px;color:#e4e4e7;font-size:13px;outline:none}
.toolbar input:focus{border-color:#f97316}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#71717a;padding:8px 12px;border-bottom:1px solid #27272a}
td{padding:8px 12px;border-bottom:1px solid #1c1c1f;font-size:13px}
tr:hover td{background:#18181b}
.empty{color:#52525b;text-align:center;padding:24px!important}

/* Buttons */
.btn-sm{padding:5px 12px;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:#f97316;color:#fff}.btn-primary:hover{background:#ea580c}
.btn-ghost{background:#27272a;color:#a1a1aa}.btn-ghost:hover{background:#3f3f46}
.btn-danger{background:#ef444420;color:#ef4444}.btn-danger:hover{background:#ef444440}
.btn-success{background:#22c55e20;color:#22c55e}.btn-success:hover{background:#22c55e40}

/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge.aniyomi{background:#8b5cf620;color:#8b5cf6}
.badge.cloudstream{background:#06b6d420;color:#06b6d4}
.badge.kotatsu{background:#ec489920;color:#ec4899}

/* Modal */
.modal-bg{position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center}
.modal-bg.hidden{display:none}
.modal{background:#18181b;border:1px solid #27272a;border-radius:12px;padding:24px;width:400px;max-width:90vw}
.modal h2{font-size:16px;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#71717a;margin-bottom:4px;margin-top:12px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal select{width:100%;padding:8px 12px;background:#0a0a0a;border:1px solid #27272a;border-radius:8px;color:#e4e4e7;font-size:13px;outline:none}
.modal input:focus,.modal select:focus{border-color:#f97316}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* Detail */
.detail-section{margin-bottom:20px}
.detail-section h3{font-size:14px;font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #27272a}

/* JAR panel */n.jar-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.jar-info .item{background:#0a0a0a;border-radius:8px;padding:12px}
.jar-info .item .k{font-size:11px;color:#71717a;text-transform:uppercase;letter-spacing:.5px}
.jar-info .item .v{font-size:14px;margin-top:2px}
.terminal{background:#0a0a0a;border:1px solid #27272a;border-radius:10px;padding:12px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:12px;line-height:1.6;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:#a1a1aa}

/* Toast */
#toast{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;animation:slideIn .2s ease}
.toast.success{background:#22c55e;color:#fff}
.toast.error{background:#ef4444;color:#fff}
.toast.info{background:#27272a;color:#e4e4e7}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Scrollbar */
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#27272a;border-radius:3px}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Bridge <span>Admin</span></h1>
    <p>AnymeX Bridge Server v2</p>
    <div class="login-error" id="loginError"></div>
    <input id="loginKey" type="password" placeholder="Admin key" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Login</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <h1>Bridge <span>Admin</span></h1>
    <div class="header-right">
      <span id="headerStats"></span>
      <span id="jarBadge" class="jar-badge off">JAR ?</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" onclick="switchTab('dashboard',this)">Dashboard</button>
    <button class="tab" onclick="switchTab('users',this)">Users</button>
    <button class="tab" onclick="switchTab('jar',this)">JAR</button>
  </nav>

  <main class="panels">
    <!-- Dashboard -->
    <div class="panel active" id="panel-dashboard">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="card">
        <h3>Recent Users</h3>
        <table><thead><tr><th>Username</th><th>Joined</th><th>Extensions</th></tr></thead>
        <tbody id="dashUsers"></tbody></table>
      </div>
    </div>

    <!-- Users -->
    <div class="panel" id="panel-users">
      <div class="toolbar">
        <input placeholder="Search users..." oninput="filterTable('usersBody',this.value)">
        <button class="btn-sm btn-primary" onclick="openModal('createUser')">+ Create User</button>
      </div>
      <table><thead><tr><th>Username</th><th>ID</th><th>Joined</th><th>Extensions</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table>
    </div>

    <!-- JAR -->
    <div class="panel" id="panel-jar">
      <div class="jar-info" id="jarInfo"></div>
      <div class="toolbar">
        <button class="btn-sm btn-primary" onclick="forceUpdate()">Force Update</button>
        <button class="btn-sm btn-ghost" onclick="loadJarStatus()">Refresh</button>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-bg hidden" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

<!-- Toast -->
<div id="toast"></div>

<script>
let token = '';
window._users = [];

function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(d){if(!d)return'-';try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch{return d}}

function toast(msg,type='info'){const el=document.getElementById('toast'),t=document.createElement('div');t.className='toast '+type;t.textContent=msg;el.appendChild(t);setTimeout(()=>t.remove(),3500)}

async function api(path,opts={}){
  const res=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}});
  return res.json();
}
async function apiPost(path,body){return api(path,{method:'POST',body:JSON.stringify(body)})}

// ── Login ──
async function doLogin(){
  const key=document.getElementById('loginKey').value.trim();
  if(!key)return;
  const r=await apiPost('/admin/login',{key});
  if(r.ok){token=r.token;document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';loadAll()}
  else{const e=document.getElementById('loginError');e.textContent='Invalid key';e.style.display='block'}
}

// ── Tabs ──
function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

// ── Modal ──
function openModal(type,data={}){
  const m=document.getElementById('modal'),bg=document.getElementById('modalBg');
  if(type==='createUser'){
    m.innerHTML=`<h2>Create User</h2><label>Username</label><input id="m_username" placeholder="min 3 chars"><label>Password</label><input id="m_password" type="password" placeholder="min 4 chars"><div class="modal-actions"><button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-sm btn-primary" onclick="doCreateUser()">Create</button></div>`;
  } else if(type==='userDetail'){
    const exts=data.installedExtensions||[];
    m.innerHTML=`<h2>${esc(data.username)}</h2><p style="color:#71717a;font-size:12px;margin-bottom:12px">ID: ${esc(data.id)} · Joined: ${fmtDate(data.created)}</p><div class="detail-section"><h3>Installed Extensions (${exts.length})</h3><table><thead><tr><th>Name</th><th>Package</th><th>Type</th><th>Version</th></tr></thead><tbody>${exts.map(e=>`<tr><td>${esc(e.name||e.pkg_name)}</td><td style="font-family:monospace;font-size:11px">${esc(e.pkg_name)}</td><td>${typeBadge(e.type)}</td><td>${esc(e.version)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No extensions installed</td></tr>'}</tbody></table></div><div class="modal-actions"><button class="btn-sm btn-ghost" onclick="closeModal()">Close</button></div>`;
  }
  bg.classList.remove('hidden');
}
function closeModal(){document.getElementById('modalBg').classList.add('hidden')}

// ── Actions ──
async function doCreateUser(){
  const u=document.getElementById('m_username').value.trim();
  const p=document.getElementById('m_password').value;
  if(!u||!p)return toast('Fill all fields','error');
  const r=await apiPost('/admin/createUser',{username:u,password:p});
  if(r.ok){toast('User created','success');closeModal();loadAll()}else toast(r.error||'Failed','error');
}

function deleteUser(id,name){
  if(!confirm(`Delete user "${name}"? This will remove all their install records.`))return;
  api('/admin/user/'+id,{method:'DELETE'}).then(r=>{if(r.ok){toast('User deleted','success');loadAll()}else toast(r.error||'Failed','error')});
}

async function loadUserDetail(id){
  toast('Loading...');
  const r=await api('/admin/user/'+id);
  if(r.error){toast(r.error,'error');return}
  openModal('userDetail',r);
}

function filterTable(bodyId,q){
  const rows=document.querySelectorAll('#'+bodyId+' tr');
  const lower=q.toLowerCase();
  rows.forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(lower)?'':'none'});
}

function typeBadge(t){return t?`<span class="badge ${t}">${t}</span>`:'-'}

// ── JAR ──
async function loadJarStatus(){
  const r=await api('/admin/jarStatus');
  document.getElementById('jarInfo').innerHTML=`
    <div class="item"><div class="k">Status</div><div class="v" style="color:${r.jarReady?'#22c55e':'#ef4444'}">${r.jarReady?'Running':'Offline'}</div></div>
    <div class="item"><div class="k">File Size</div><div class="v">${r.fileSizeMB||0} MB</div></div>
    <div class="item"><div class="k">Path</div><div class="v" style="font-family:monospace;font-size:11px;word-break:break-all">${esc(r.jarPath)}</div></div>
    <div class="item"><div class="k">Bytes</div><div class="v">${r.fileSize||0}</div></div>`;
  const badge=document.getElementById('jarBadge');
  badge.textContent=r.jarReady?'JAR On':'JAR Off';
  badge.className='jar-badge '+(r.jarReady?'on':'off');
}

async function forceUpdate(){
  toast('Updating JAR...','info');
  const r=await apiPost('/admin/forceUpdate',{});
  if(r.ok){toast(`Updated in ${r.elapsed}ms`,'success');loadJarStatus()}else toast('Failed','error');
}

// ── Load All ──
async function loadAll(){
  try{
    const [stats,users]=await Promise.all([api('/admin/stats'),api('/admin/users')]);
    window._users=users;

    // Header
    document.getElementById('headerStats').textContent=`${stats.totalUsers} users · ${stats.installs} installs`;

    // Dashboard stats
    const userDetails=stats.users||[];
    document.getElementById('statsGrid').innerHTML=
      [['Users',stats.totalUsers,''],['Installs',stats.installs,'orange'],['JAR',stats.jarReady?'Online':'Offline',stats.jarReady?'green':'']].map(([l,v,c])=>
        `<div class="stat-card"><div class="label">${l}</div><div class="value ${c}">${v}</div></div>`
      ).join('');

    // Dashboard users table
    document.getElementById('dashUsers').innerHTML=users.map(u=>{
      const uc=userDetails.find(x=>x.id===u.id)||{extensions:0};
      return `<tr><td>${esc(u.username)}</td><td>${fmtDate(u.created)}</td><td>${uc.extensions||0}</td><td><button class="btn-sm btn-ghost" onclick="loadUserDetail('${u.id}')">Detail</button></td></tr>`;
    }).join('')||'<tr><td colspan="4" class="empty">No users</td></tr>';

    // Users table
    document.getElementById('usersBody').innerHTML=users.map(u=>{
      const uc=userDetails.find(x=>x.id===u.id)||{extensions:0};
      return `<tr><td>${esc(u.username)}</td><td style="font-family:monospace;font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis" title="${esc(u.id)}">${esc(u.id)}</td><td>${fmtDate(u.created)}</td><td>${uc.extensions||0}</td><td><button class="btn-sm btn-ghost" onclick="loadUserDetail('${u.id}')">Detail</button><button class="btn-sm btn-danger" onclick="deleteUser('${u.id}','${esc(u.username)}')">Del</button></td></tr>`;
    }).join('')||'<tr><td colspan="5" class="empty">No users</td></tr>';

    // JAR
    loadJarStatus();

  }catch(e){console.error(e);toast('Failed to load data','error')}
}
</script>
</body>
</html>
