<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e4e4e7; min-height: 100vh; }

/* Login */
#loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 40px; width: 340px; }
.login-box h1 { font-size: 20px; margin-bottom: 8px; }
.login-box p { color: #71717a; font-size: 13px; margin-bottom: 24px; }
.login-box input { width: 100%; padding: 10px 12px; background: #0a0a0a; border: 1px solid #27272a; border-radius: 8px; color: #e4e4e7; font-size: 14px; outline: none; margin-bottom: 12px; }
.login-box input:focus { border-color: #f97316; }
.login-box button { width: 100%; padding: 10px; background: #f97316; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.login-box button:hover { background: #ea580c; }
.login-error { color: #ef4444; font-size: 13px; margin-bottom: 12px; display: none; }

/* Layout */
#app { display: none; }
header { background: #18181b; border-bottom: 1px solid #27272a; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 16px; font-weight: 600; }
header h1 span { color: #f97316; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-right span { color: #71717a; font-size: 13px; }
.btn-logout { padding: 6px 12px; background: transparent; border: 1px solid #27272a; border-radius: 6px; color: #a1a1aa; font-size: 12px; cursor: pointer; }
.btn-logout:hover { border-color: #ef4444; color: #ef4444; }

/* Tabs */
nav { padding: 16px 24px 0; display: flex; gap: 4px; }
.tab { padding: 8px 16px; border: none; background: transparent; color: #71717a; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; }
.tab:hover { color: #a1a1aa; }
.tab.active { color: #f97316; border-bottom-color: #f97316; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding: 20px 24px; }
.stat-card { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 20px; }
.stat-card .label { font-size: 12px; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.stat-card .value.orange { color: #f97316; }

/* Table */
.content { padding: 0 24px 24px; }
.table-wrap { background: #18181b; border: 1px solid #27272a; border-radius: 10px; overflow: hidden; }
.search-bar { padding: 12px 16px; border-bottom: 1px solid #27272a; }
.search-bar input { width: 100%; max-width: 320px; padding: 7px 12px; background: #0a0a0a; border: 1px solid #27272a; border-radius: 6px; color: #e4e4e7; font-size: 13px; outline: none; }
.search-bar input:focus { border-color: #f97316; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; padding: 10px 16px; color: #71717a; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #27272a; }
tbody tr { border-bottom: 1px solid #1c1c1f; transition: background 0.15s; }
tbody tr:hover { background: #1c1c1f; }
tbody td { padding: 10px 16px; color: #a1a1aa; }
tbody td:first-child { color: #e4e4e7; font-weight: 500; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.badge.anime { background: #f9731620; color: #f97316; }
.badge.manga { background: #22c55e20; color: #22c55e; }
.badge.cloudstream { background: #a855f720; color: #a855f7; }
.badge.kotatsu { background: #06b6d420; color: #06b6d4; }
.badge.nsfw { background: #ef444420; color: #ef4444; margin-left: 4px; }
.btn-sm { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; border: none; }
.btn-danger { background: #ef444420; color: #ef4444; }
.btn-danger:hover { background: #ef444440; }
.btn-ghost { background: #27272a; color: #a1a1aa; }
.btn-ghost:hover { background: #3f3f46; }

/* Tab panels */
.panel { display: none; }
.panel.active { display: block; }

/* Empty state */
.empty { text-align: center; padding: 48px; color: #52525b; }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 12px 20px; font-size: 13px; color: #e4e4e7; transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 99; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { border-color: #ef4444; color: #ef4444; }
.toast.success { border-color: #22c55e; color: #22c55e; }

/* Responsive */
@media (max-width: 640px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .table-wrap { overflow-x: auto; }
  table { min-width: 600px; }
}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Bridge Admin</h1>
    <p>Enter admin key to continue</p>
    <div class="login-error" id="loginError">Invalid key</div>
    <input type="password" id="keyInput" placeholder="Admin key" autofocus>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <h1><span>Bridge</span> Admin</h1>
    <div class="header-right">
      <span id="headerStats"></span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <nav>
    <button class="tab active" onclick="switchTab('dashboard', this)">Dashboard</button>
    <button class="tab" onclick="switchTab('users', this)">Users</button>
    <button class="tab" onclick="switchTab('repos', this)">Repos</button>
    <button class="tab" onclick="switchTab('extensions', this)">Extensions</button>
  </nav>

  <!-- Dashboard -->
  <div class="panel active" id="panel-dashboard">
    <div class="stats" id="statsGrid"></div>
    <div class="content">
      <div class="table-wrap">
        <div class="search-bar"><input placeholder="Search users..." oninput="filterTable('usersBody', this.value)"></div>
        <table><thead><tr><th>User</th><th>Joined</th><th>Repos</th><th>Extensions</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Users -->
  <div class="panel" id="panel-users">
    <div class="content">
      <div class="table-wrap">
        <div class="search-bar"><input placeholder="Search users..." oninput="filterTable('usersBody2', this.value)"></div>
        <table><thead><tr><th>User</th><th>ID</th><th>Joined</th><th>Repos</th><th>Extensions</th><th>Actions</th></tr></thead><tbody id="usersBody2"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Repos -->
  <div class="panel" id="panel-repos">
    <div class="content">
      <div class="table-wrap">
        <div class="search-bar"><input placeholder="Search repos..." oninput="filterTable('reposBody', this.value)"></div>
        <table><thead><tr><th>Repo</th><th>Type</th><th>Added</th><th>Last Fetched</th><th>Users</th><th>Extensions</th><th>Actions</th></tr></thead><tbody id="reposBody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Extensions -->
  <div class="panel" id="panel-extensions">
    <div class="content">
      <div class="table-wrap">
        <div class="search-bar"><input placeholder="Search extensions..." oninput="filterTable('extsBody', this.value)"></div>
        <table><thead><tr><th>Extension</th><th>Type</th><th>Version</th><th>Lang</th><th>Installs</th><th>Actions</th></tr></thead><tbody id="extsBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let token = localStorage.getItem('bridge_admin_token') || '';
const keyInput = document.getElementById('keyInput');
keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...opts.headers },
    ...opts
  });
  if (res.status === 401) { logout(); throw new Error('unauthorized'); }
  return res.json();
}

async function login() {
  const key = keyInput.value.trim();
  if (!key) return;
  try {
    const r = await fetch(API + '/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const d = await r.json();
    if (d.ok) {
      token = d.token;
      localStorage.setItem('bridge_admin_token', token);
      showApp();
    } else {
      const el = document.getElementById('loginError');
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 2000);
    }
  } catch(e) { toast('Connection failed', 'error'); }
}

function logout() {
  token = '';
  localStorage.removeItem('bridge_admin_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  keyInput.value = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

function filterTable(tbodyId, query) {
  const q = query.toLowerCase();
  document.getElementById(tbodyId).querySelectorAll('tr').forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.className = 'toast', 2500);
}

function typeBadge(type) {
  const t = (type || '').replace('aniyomi-', '');
  return `<span class="badge ${t}">${t}</span>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '-'; }

async function loadAll() {
  const [stats, users, repos, extensions] = await Promise.all([
    api('/admin/stats'),
    api('/admin/users'),
    api('/admin/repos'),
    api('/admin/extensions')
  ]);

  document.getElementById('headerStats').textContent = `${stats.users} users · ${stats.extensions} exts`;

  // Stats grid
  document.getElementById('statsGrid').innerHTML = [
    ['Users', stats.users],
    ['Repos', stats.repos],
    ['Extensions', stats.extensions],
    ['Installs', stats.installs]
  ].map(([l, v]) => `<div class="stat-card"><div class="label">${l}</div><div class="value orange">${v}</div></div>`).join('');

  // User maps
  const userRepoCounts = {};
  const userExtCounts = {};
  stats.userDetails?.forEach(u => { userRepoCounts[u.id] = u.repos; userExtCounts[u.id] = u.extensions; });

  // Dashboard users (compact)
  document.getElementById('usersBody').innerHTML = users.map(u => `
    <tr>
      <td>${esc(u.username)}</td>
      <td>${fmtDate(u.created)}</td>
      <td>${userRepoCounts[u.id] ?? 0}</td>
      <td>${userExtCounts[u.id] ?? 0}</td>
      <td><button class="btn-sm btn-danger" onclick="deleteUser('${u.id}','${esc(u.username)}')">Delete</button></td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="empty">No users</td></tr>';

  // Users tab (full)
  document.getElementById('usersBody2').innerHTML = users.map(u => `
    <tr>
      <td>${esc(u.username)}</td>
      <td style="font-family:monospace;font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis">${esc(u.id)}</td>
      <td>${fmtDate(u.created)}</td>
      <td>${userRepoCounts[u.id] ?? 0}</td>
      <td>${userExtCounts[u.id] ?? 0}</td>
      <td><button class="btn-sm btn-danger" onclick="deleteUser('${u.id}','${esc(u.username)}')">Delete</button></td>
    </tr>
  `).join('') || '<tr><td colspan="6" class="empty">No users</td></tr>';

  // Repos
  document.getElementById('reposBody').innerHTML = repos.map(r => `
    <tr>
      <td title="${esc(r.url)}">${esc(r.name || r.shortname || r.url)}</td>
      <td>${typeBadge(r.type)}</td>
      <td>${fmtDate(r.added)}</td>
      <td>${fmtDate(r.last_fetched)}</td>
      <td>${r.userCount ?? 0}</td>
      <td>${r.extCount ?? 0}</td>
      <td><button class="btn-sm btn-danger" onclick="deleteRepo(${r.id},'${esc(r.name || r.url)}')">Delete</button></td>
    </tr>
  `).join('') || '<tr><td colspan="7" class="empty">No repos</td></tr>';

  // Extensions
  document.getElementById('extsBody').innerHTML = extensions.map(e => `
    <tr>
      <td>${esc(e.name)}</td>
      <td>${typeBadge(e.type)}${e.is_nsfw ? '<span class="badge nsfw">NSFW</span>' : ''}</td>
      <td>${esc(e.version)}</td>
      <td>${esc(e.lang)}</td>
      <td>${e.installCount ?? 0}</td>
      <td><button class="btn-sm btn-danger" onclick="deleteExtension(${e.id},'${esc(e.name)}')">Delete</button></td>
    </tr>
  `).join('') || '<tr><td colspan="6" class="empty">No extensions</td></tr>';
}

async function deleteUser(id, name) {
  if (!confirm(`Delete user "${name}" and all their data?`)) return;
  const r = await api('/admin/user/' + id, { method: 'DELETE' });
  if (r.ok) { toast('User deleted', 'success'); loadAll(); } else toast(r.error || 'Failed', 'error');
}

async function deleteRepo(id, name) {
  if (!confirm(`Delete repo "${name}"? This removes it from ALL users.`)) return;
  const r = await api('/admin/repo/' + id, { method: 'DELETE' });
  if (r.ok) { toast('Repo deleted', 'success'); loadAll(); } else toast(r.error || 'Failed', 'error');
}

async function deleteExtension(id, name) {
  if (!confirm(`Delete extension "${name}"? This removes it from ALL users.`)) return;
  const r = await api('/admin/extension/' + id, { method: 'DELETE' });
  if (r.ok) { toast('Extension deleted', 'success'); loadAll(); } else toast(r.error || 'Failed', 'error');
}

// Auto-login if token exists
if (token) showApp();
</script>
</body>
</html>
