<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e4e4e7;min-height:100vh}

/* Login */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#18181b;border:1px solid #27272a;border-radius:12px;padding:40px;width:340px}
.login-box h1{font-size:20px;margin-bottom:8px}
.login-box h1 span{color:#f97316}
.login-box p{color:#71717a;font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:10px 12px;background:#0a0a0a;border:1px solid #27272a;border-radius:8px;color:#e4e4e7;font-size:14px;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:#f97316}
.login-box button{width:100%;padding:10px;background:#f97316;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.login-box button:hover{background:#ea580c}
.login-error{color:#ef4444;font-size:13px;margin-bottom:12px;display:none}

/* Layout */
#app{display:none}
header{background:#18181b;border-bottom:1px solid #27272a;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:16px;font-weight:600}
header h1 span{color:#f97316}
.header-right{display:flex;align-items:center;gap:12px}
.header-right .jar-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.header-right .jar-badge.on{background:#22c55e20;color:#22c55e}
.header-right .jar-badge.off{background:#ef444420;color:#ef4444}
.btn-logout{padding:6px 12px;background:transparent;border:1px solid #27272a;border-radius:6px;color:#a1a1aa;font-size:12px;cursor:pointer}
.btn-logout:hover{border-color:#ef4444;color:#ef4444}

/* Tabs */
nav{padding:16px 24px 0;display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:8px 16px;border:none;background:transparent;color:#71717a;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tab:hover{color:#a1a1aa}
.tab.active{color:#f97316;border-bottom-color:#f97316}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:20px 24px}
.stat-card{background:#18181b;border:1px solid #27272a;border-radius:10px;padding:16px}
.stat-card .label{font-size:11px;color:#71717a;text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:26px;font-weight:700;margin-top:2px;color:#f97316}

/* Table */
.content{padding:0 24px 24px}
.table-wrap{background:#18181b;border:1px solid #27272a;border-radius:10px;overflow:hidden}
.table-bar{padding:12px 16px;border-bottom:1px solid #27272a;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.table-bar input,.table-bar select{padding:7px 12px;background:#0a0a0a;border:1px solid #27272a;border-radius:6px;color:#e4e4e7;font-size:13px;outline:none}
.table-bar input:focus,.table-bar select:focus{border-color:#f97316}
.table-bar input{flex:1;min-width:160px;max-width:320px}
.table-bar select{min-width:100px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 16px;color:#71717a;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #27272a;white-space:nowrap}
tbody tr{border-bottom:1px solid #1c1c1f;transition:background .15s}
tbody tr:hover{background:#1c1c1f}
tbody td{padding:10px 16px;color:#a1a1aa;white-space:nowrap}
tbody td:first-child{color:#e4e4e7;font-weight:500}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge.anime{background:#f9731620;color:#f97316}
.badge.manga{background:#22c55e20;color:#22c55e}
.badge.cloudstream{background:#a855f720;color:#a855f7}
.badge.kotatsu{background:#06b6d420;color:#06b6d4}
.badge.nsfw{background:#ef444420;color:#ef4444;margin-left:4px}
.btn-sm{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:none;margin:1px}
.btn-primary{background:#f97316;color:#fff}
.btn-primary:hover{background:#ea580c}
.btn-danger{background:#ef444420;color:#ef4444}
.btn-danger:hover{background:#ef444440}
.btn-ghost{background:#27272a;color:#a1a1aa}
.btn-ghost:hover{background:#3f3f46}
.btn-success{background:#22c55e20;color:#22c55e}
.btn-success:hover{background:#22c55e40}

/* Forms / Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:#18181b;border:1px solid #27272a;border-radius:12px;padding:24px;width:440px;max-width:90vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#71717a;margin-bottom:4px;margin-top:12px;text-transform:uppercase;letter-spacing:.3px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 12px;background:#0a0a0a;border:1px solid #27272a;border-radius:6px;color:#e4e4e7;font-size:13px;outline:none}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#f97316}
.modal textarea{min-height:80px;font-family:monospace;font-size:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* Terminal */
.terminal{background:#0c0c0c;border:1px solid #27272a;border-radius:10px;padding:16px 24px 24px}
.terminal .input-row{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end;flex-wrap:wrap}
.terminal .input-row label{font-size:11px;color:#71717a;margin-bottom:0;white-space:nowrap}
.terminal .input-row input{flex:1;min-width:120px;padding:7px 12px;background:#0a0a0a;border:1px solid #27272a;border-radius:6px;color:#e4e4e7;font-size:12px;outline:none;font-family:monospace}
.terminal .input-row input:focus{border-color:#f97316}
.terminal textarea{width:100%;min-height:280px;background:#0c0c0c;border:1px solid #1c1c1f;border-radius:8px;color:#a1a1aa;font-family:monospace;font-size:12px;padding:12px;resize:vertical;outline:none}
.output-meta{display:flex;gap:12px;margin-top:8px;font-size:11px;color:#52525b}
.output-meta .ok{color:#22c55e}
.output-meta .err{color:#ef4444}

/* Panel / empty */
.panel{display:none}
.panel.active{display:block}
.empty{text-align:center;padding:48px;color:#52525b}

/* User detail sidebar */
.detail-section{margin-top:12px}
.detail-section h3{font-size:13px;color:#71717a;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.detail-section table{margin-top:0}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#18181b;border:1px solid #27272a;border-radius:8px;padding:12px 20px;font-size:13px;color:#e4e4e7;transform:translateY(80px);opacity:0;transition:all .3s;z-index:99}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-color:#ef4444;color:#ef4444}
.toast.success{border-color:#22c55e;color:#22c55e}

/* Responsive */
@media(max-width:640px){
  .stats{grid-template-columns:1fr 1fr}
  .table-wrap{overflow-x:auto}
  table{min-width:600px}
  nav{padding:12px 16px 0}
  .content{padding:0 16px 16px}
  .stats{padding:16px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1><span>Bridge</span> Admin</h1>
    <p>Enter admin key to continue</p>
    <div class="login-error" id="loginError">Invalid key</div>
    <input type="password" id="keyInput" placeholder="Admin key" autofocus>
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="app">
  <header>
    <h1><span>Bridge</span> Admin</h1>
    <div class="header-right">
      <span class="jar-badge off" id="jarBadge">JAR</span>
      <span id="headerStats" style="color:#71717a;font-size:13px"></span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <nav>
    <button class="tab active" onclick="switchTab('dashboard',this)">Dashboard</button>
    <button class="tab" onclick="switchTab('users',this)">Users</button>
    <button class="tab" onclick="switchTab('repos',this)">Repos</button>
    <button class="tab" onclick="switchTab('extensions',this)">Extensions</button>
    <button class="tab" onclick="switchTab('terminal',this)">Terminal</button>
  </nav>

  <!-- Dashboard -->
  <div class="panel active" id="panel-dashboard">
    <div class="stats" id="statsGrid"></div>
    <div class="content">
      <div class="table-wrap">
        <div class="table-bar">
          <input placeholder="Search users..." oninput="filterTable('dashUsers',this.value)">
        </div>
        <table><thead><tr><th>User</th><th>Joined</th><th>Repos</th><th>Installed</th><th>Actions</th></tr></thead><tbody id="dashUsers"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Users -->
  <div class="panel" id="panel-users">
    <div class="content">
      <div class="table-wrap">
        <div class="table-bar">
          <input placeholder="Search users..." oninput="filterTable('usersBody',this.value)">
          <button class="btn-sm btn-primary" onclick="openModal('createUser')">+ Create User</button>
        </div>
        <table><thead><tr><th>User</th><th>ID</th><th>Joined</th><th>Repos</th><th>Installed</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Repos -->
  <div class="panel" id="panel-repos">
    <div class="content">
      <div class="table-wrap">
        <div class="table-bar">
          <input placeholder="Search repos..." oninput="filterTable('reposBody',this.value)">
          <button class="btn-sm btn-primary" onclick="openModal('addRepo')">+ Add Repo</button>
        </div>
        <table><thead><tr><th>Repo</th><th>Type</th><th>Users</th><th>Extensions</th><th>Last Fetched</th><th>Actions</th></tr></thead><tbody id="reposBody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Extensions -->
  <div class="panel" id="panel-extensions">
    <div class="content">
      <div class="table-wrap">
        <div class="table-bar">
          <input placeholder="Search extensions..." oninput="filterTable('extsBody',this.value)">
          <select id="extTypeFilter" onchange="filterExts()"><option value="">All types</option><option value="aniyomi-anime">Anime</option><option value="aniyomi-manga">Manga</option><option value="cloudstream">CloudStream</option><option value="kotatsu">Kotatsu</option></select>
          <button class="btn-sm btn-ghost" onclick="loadAll()">Refresh</button>
        </div>
        <table><thead><tr><th>ID</th><th>Extension</th><th>Type</th><th>Version</th><th>Lang</th><th>Installs</th><th>File</th><th>Actions</th></tr></thead><tbody id="extsBody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Terminal -->
  <div class="panel" id="panel-terminal">
    <div class="content">
      <div class="terminal">
        <div class="input-row">
          <label>Method</label>
          <input id="invokeMethod" placeholder="e.g. getPopular" value="getPopular">
        </div>
        <div class="input-row">
          <label>Args (JSON)</label>
          <input id="invokeArgs" placeholder='{"sourceId":"..."}' value='{}'>
          <button class="btn-sm btn-primary" onclick="runInvoke()" style="margin-left:4px;height:36px">Run</button>
        </div>
        <div class="input-row">
          <label>Timeout (s)</label>
          <input id="invokeTimeout" type="number" value="30" style="max-width:80px">
          <button class="btn-sm btn-ghost" onclick="runForceUpdate()">Force Update All Repos</button>
          <button class="btn-sm btn-ghost" onclick="runJarStatus()">JAR Status</button>
        </div>
        <textarea id="outputArea" readonly placeholder="Output will appear here..."></textarea>
        <div class="output-meta" id="outputMeta"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="modalOverlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let token=localStorage.getItem('bridge_admin_token')||'';
const keyInput=document.getElementById('keyInput');
keyInput.addEventListener('keydown',e=>{if(e.key==='Enter')login()});

// ── API ──
async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},...opts});
  if(r.status===401){logout();throw new Error('unauthorized')}
  return r.json();
}

async function apiPost(path,body){
  return api(path,{method:'POST',body:JSON.stringify(body)});
}

// ── Auth ──
async function login(){
  const key=keyInput.value.trim();if(!key)return;
  try{
    const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const d=await r.json();
    if(d.ok){token=d.token;localStorage.setItem('bridge_admin_token',token);showApp()}
    else{const el=document.getElementById('loginError');el.style.display='block';setTimeout(()=>el.style.display='none',2000)}
  }catch(e){toast('Connection failed','error')}
}
function logout(){token='';localStorage.removeItem('bridge_admin_token');document.getElementById('app').style.display='none';document.getElementById('loginScreen').style.display='flex';keyInput.value=''}
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';loadAll();loadJarStatus()}

// ── Tabs ──
function switchTab(name,btn){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById('panel-'+name).classList.add('active')}

// ── Util ──
function filterTable(id,q){q=q.toLowerCase();document.getElementById(id).querySelectorAll('tr').forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'})}
function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+type;setTimeout(()=>el.className='toast',2500)}
function typeBadge(t){const s=(t||'').replace('aniyomi-','');return`<span class="badge ${s}">${s}</span>`}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtDate(d){return d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-'}
function fmtSize(b){if(!b)return'-';if(b>1048576)return(b/1048576).toFixed(1)+'MB';if(b>1024)return(b/1024).toFixed(0)+'KB';return b+'B'}

// ── Modal ──
function openModal(type,data){
  const m=document.getElementById('modalContent');
  if(type==='createUser') m.innerHTML=`<h2>Create User</h2><label>Username</label><input id="m_username" placeholder="min 3 chars"><label>Password</label><input id="m_password" type="password" placeholder="min 4 chars"><div class="modal-actions"><button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-sm btn-primary" onclick="doCreateUser()">Create</button></div>`;
  else if(type==='addRepo') m.innerHTML=`<h2>Add Repo</h2><label>User</label><select id="m_userId">${window._users.map(u=>`<option value="${u.id}">${esc(u.username)}</option>`).join('')}</select><label>Repo URL</label><input id="m_repoUrl" placeholder="https://..."><label>Type (optional, auto-detect)</label><select id="m_repoType"><option value="">Auto-detect</option><option value="aniyomi">Aniyomi</option><option value="cloudstream">CloudStream</option><option value="kotatsu">Kotatsu</option></select><div class="modal-actions"><button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-sm btn-primary" onclick="doAddRepo()">Add</button></div>`;
  else if(type==='userDetail') m.innerHTML=`<h2>${esc(data.username)}</h2><p style="color:#71717a;font-size:12px;margin-bottom:12px">ID: ${esc(data.id)} · Joined: ${fmtDate(data.created)}</p><div class="detail-section"><h3>Repos (${(data.repos||[]).length})</h3><table><thead><tr><th>Name</th><th>Type</th><th>URL</th></tr></thead><tbody>${(data.repos||[]).map(r=>`<tr><td>${esc(r.name||'-')}</td><td>${typeBadge(r.type)}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${esc(r.url)}">${esc(r.url)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No repos</td></tr>'}</tbody></table></div><div class="detail-section"><h3>Installed Extensions (${(data.installedExtensions||[]).length})</h3><table><thead><tr><th>Name</th><th>Type</th><th>Version</th></tr></thead><tbody>${(data.installedExtensions||[]).map(e=>`<tr><td>${esc(e.name)}</td><td>${typeBadge(e.type)}</td><td>${esc(e.version)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">None</td></tr>'}</tbody></table></div><div class="detail-section"><h3>Available Extensions (${(data.availableExtensions||[]).length})</h3><table><thead><tr><th>Name</th><th>Type</th><th>Version</th><th>Action</th></tr></thead><tbody>${(data.availableExtensions||[]).map(e=>`<tr><td>${esc(e.name)}</td><td>${typeBadge(e.type)}</td><td>${esc(e.version)}</td><td><button class="btn-sm btn-success" onclick="doInstallExt('${data.id}',${e.id},this)">Install</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">None (add repos first)</td></tr>'}</tbody></table></div>`;
  else if(type==='installForUser') m.innerHTML=`<h2>Install Extension for User</h2><label>Extension: ${esc(data.name)} (#${data.id})</label><label>User</label><select id="m_userId">${window._users.map(u=>`<option value="${u.id}">${esc(u.username)}</option>`).join('')}</select><div class="modal-actions"><button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-sm btn-primary" onclick="doInstallExtModal(${data.id})">Install</button></div>`;
  document.getElementById('modalOverlay').style.display='flex';
}
function closeModal(){document.getElementById('modalOverlay').style.display='none'}

// ── Actions ──
async function doCreateUser(){
  const u=document.getElementById('m_username').value.trim();
  const p=document.getElementById('m_password').value;
  if(!u||!p)return toast('Fill all fields','error');
  const r=await apiPost('/admin/createUser',{username:u,password:p});
  if(r.ok){toast('User created','success');closeModal();loadAll()}else toast(r.error||'Failed','error');
}
async function doAddRepo(){
  const uid=document.getElementById('m_userId').value;
  const url=document.getElementById('m_repoUrl').value.trim();
  const type=document.getElementById('m_repoType').value||undefined;
  if(!url)return toast('URL required','error');
  toast('Adding repo...');closeModal();
  const r=await apiPost('/admin/addRepo',{userId:uid,url,type});
  if(r.ok){toast(`Repo added (${r.extensions||0} extensions)`,'success');loadAll()}else toast(r.error||'Failed','error');
}
async function doInstallExt(userId,extId,btn){
  if(btn)btn.disabled=true;
  const r=await apiPost('/admin/installExtension',{userId,extId});
  if(r.ok)toast('Installed','success');else toast(r.error||'Failed','error');
  if(btn)btn.disabled=false;
}
async function doInstallExtModal(extId){
  const uid=document.getElementById('m_userId').value;
  const r=await apiPost('/admin/installExtension',{userId:uid,extId});
  if(r.ok){toast('Installed','success');closeModal();loadAll()}else toast(r.error||'Failed','error');
}
async function doUninstallExt(userId,extId){
  const r=await apiPost('/admin/uninstallExtension',{userId,extId});
  if(r.ok)toast('Uninstalled','success');else toast(r.error||'Failed','error');
}
async function doDownloadExt(extId,force){
  toast('Downloading...');
  const r=await apiPost('/admin/downloadExtension',{extId,force:!!force});
  if(r.ok)toast(`Downloaded: ${r.filePath||'ok'}${r.updated?' [UPDATED]':''}`,'success');else toast(r.error||'Failed','error');
  loadAll();
}
async function doRefreshRepo(repoId){
  toast('Refreshing repo...');
  const r=await apiPost('/admin/refreshRepo',{repoId});
  if(r.ok)toast(`Refreshed (${r.updated?.length||0} updated)`,'success');else toast(r.error||'Failed','error');
  loadAll();
}
async function deleteUser(id,name){
  if(!confirm(`Delete user "${name}" and ALL their data?`))return;
  const r=await api('/admin/user/'+id,{method:'DELETE'});
  if(r.ok){toast('Deleted','success');loadAll()}else toast(r.error||'Failed','error');
}
async function deleteRepo(id,name){
  if(!confirm(`Delete repo "${name}"? Removes from ALL users.`))return;
  const r=await api('/admin/repo/'+id,{method:'DELETE'});
  if(r.ok){toast('Deleted','success');loadAll()}else toast(r.error||'Failed','error');
}
async function deleteExtension(id,name){
  if(!confirm(`Delete extension "${name}"? Removes from ALL users.`))return;
  const r=await api('/admin/extension/'+id,{method:'DELETE'});
  if(r.ok){toast('Deleted','success');loadAll()}else toast(r.error||'Failed','error');
}

// ── Terminal ──
async function runInvoke(){
  const method=document.getElementById('invokeMethod').value.trim();
  let args={};try{args=JSON.parse(document.getElementById('invokeArgs').value||'{}')}catch{args={}};
  const timeout=(parseInt(document.getElementById('invokeTimeout').value)||30)*1000;
  const out=document.getElementById('outputArea');
  out.value='Running '+method+'...\n';
  document.getElementById('outputMeta').innerHTML='';
  const t0=Date.now();
  try{
    const r=await apiPost('/admin/invoke',{method,args,timeout});
    const elapsed=Date.now()-t0;
    if(r.ok){
      out.value=JSON.stringify(r.data,null,2);
      document.getElementById('outputMeta').innerHTML=`<span class="ok">OK</span> · ${elapsed}ms`;
    }else{
      out.value='ERROR: '+r.error;
      document.getElementById('outputMeta').innerHTML=`<span class="err">FAILED</span> · ${elapsed}ms`;
    }
  }catch(e){out.value='EXCEPTION: '+e.message;document.getElementById('outputMeta').innerHTML=`<span class="err">ERROR</span>`}
}
async function runForceUpdate(){
  const out=document.getElementById('outputArea');
  out.value='Force updating all repos...\n';
  const t0=Date.now();
  try{
    const r=await apiPost('/admin/forceUpdate',{});
    out.value+=JSON.stringify(r,null,2);
    document.getElementById('outputMeta').innerHTML=`<span class="ok">OK</span> · ${Date.now()-t0}ms`;
    loadAll();
  }catch(e){out.value+='ERROR: '+e.message}
}
async function runJarStatus(){
  const r=await api('/admin/jarStatus');
  document.getElementById('outputArea').value=JSON.stringify(r,null,2);
  document.getElementById('outputMeta').innerHTML=r.jarReady?'<span class="ok">JAR Ready</span>':'<span class="err">JAR Not Ready</span>';
  loadJarStatus();
}

// ── JAR badge ──
async function loadJarStatus(){
  try{
    const r=await api('/admin/jarStatus');
    const b=document.getElementById('jarBadge');
    b.className='jar-badge '+(r.jarReady?'on':'off');
    b.textContent='JAR '+(r.jarReady?'Ready':('('+r.fileSizeMB+'MB)'));
  }catch{}
}

// ── Load data ──
async function loadAll(){
  try{
    const [stats,users,repos,extensions]=await Promise.all([api('/admin/stats'),api('/admin/users'),api('/admin/repos'),api('/admin/extensions')]);
    window._users=users;
    document.getElementById('headerStats').textContent=`${stats.users} users · ${stats.extensions} exts · ${stats.installs} installs`;

    // Stats grid
    document.getElementById('statsGrid').innerHTML=[
      ['Users',stats.users],['Repos',stats.repos],['Extensions',stats.extensions],['Installs',stats.installs]
    ].map(([l,v])=>`<div class="stat-card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');

    // User counts
    const uc={};users.forEach(u=>{uc[u.id]={repos:0,exts:0}});
    (stats.userDetails||[]).forEach(u=>{if(uc[u.id])uc[u.id]={repos:u.repos,exts:u.extensions}});

    // Dashboard users
    document.getElementById('dashUsers').innerHTML=users.map(u=>`<tr><td>${esc(u.username)}</td><td>${fmtDate(u.created)}</td><td>${uc[u.id].repos}</td><td>${uc[u.id].exts}</td><td><button class="btn-sm btn-ghost" onclick="loadUserDetail('${u.id}')">Detail</button><button class="btn-sm btn-danger" onclick="deleteUser('${u.id}','${esc(u.username)}')">Del</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No users</td></tr>';

    // Users tab
    document.getElementById('usersBody').innerHTML=users.map(u=>`<tr><td>${esc(u.username)}</td><td style="font-family:monospace;font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis" title="${esc(u.id)}">${esc(u.id)}</td><td>${fmtDate(u.created)}</td><td>${uc[u.id].repos}</td><td>${uc[u.id].exts}</td><td><button class="btn-sm btn-ghost" onclick="loadUserDetail('${u.id}')">Detail</button><button class="btn-sm btn-danger" onclick="deleteUser('${u.id}','${esc(u.username)}')">Del</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No users</td></tr>';

    // Repos
    document.getElementById('reposBody').innerHTML=repos.map(r=>`<tr><td title="${esc(r.url)}">${esc(r.name||r.shortname||r.url)}</td><td>${typeBadge(r.type)}</td><td>${r.userCount||0}</td><td>${r.extCount||0}</td><td>${fmtDate(r.last_fetched)}</td><td><button class="btn-sm btn-ghost" onclick="doRefreshRepo(${r.id})">Refresh</button><button class="btn-sm btn-danger" onclick="deleteRepo(${r.id},'${esc(r.name||r.url)}')">Del</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No repos</td></tr>';

    // Extensions
    renderExtensions(extensions);
  }catch(e){console.error(e)}
}

function renderExtensions(exts){
  const tf=document.getElementById('extTypeFilter').value;
  const filtered=tf?exts.filter(e=>e.type===tf):exts;
  document.getElementById('extsBody').innerHTML=filtered.map(e=>`<tr><td>${e.id}</td><td>${esc(e.name)}</td><td>${typeBadge(e.type)}${e.is_nsfw?'<span class="badge nsfw">NSFW</span>':''}</td><td>${esc(e.version)}</td><td>${esc(e.lang)}</td><td>${e.installCount||0}</td><td>${e.file_path?'<button class="btn-sm btn-ghost" onclick="doDownloadExt('+e.id+',false)" title="Re-download">${esc(e.file_path.split('/').pop())}</button>':'<button class="btn-sm btn-ghost" onclick="doDownloadExt('+e.id+',true)">Download</button>'}</td><td><button class="btn-sm btn-success" onclick="openModal('installForUser',{id:${e.id},name:'${esc(e.name)}'})">Install</button><button class="btn-sm btn-danger" onclick="deleteExtension(${e.id},'${esc(e.name)}')">Del</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No extensions</td></tr>';
}
function filterExts(){api('/admin/extensions').then(renderExtensions)}

async function loadUserDetail(uid){
  toast('Loading user...');
  const d=await api('/admin/user/'+uid);
  openModal('userDetail',d);
}

if(token)showApp();
</script>
