# JVM Bridge Server — Gradle Properties
# =========================================
# Configures Gradle daemon, memory, and Kotlin compiler settings.

# Kotlin code style — use IntelliJ IDEA format
kotlin.code.style=official

# Gradle daemon memory allocation (1 GB for extension loading which can be memory-intensive)
org.gradle.jvmargs=-Xmx1024m

# Parallel project execution for faster builds
org.gradle.parallel=true

# Kotlin incremental compilation
kotlin.incremental=true
