# JVM Bridge Server — Dependency Version Catalog
# =================================================
# Centralized version management for all dependencies.
# References: https://docs.gradle.org/current/userguide/version-catalogs.html

[versions]
# Kotlin
kotlin = "1.9.24"
kotlinx-coroutines = "1.8.1"
kotlinx-cli = "0.3.7"

# Ktor (server framework)
ktor = "2.3.12"

# Serialization
gson = "2.11.0"

# HTTP Client
okhttp = "4.12.0"

# DEX Processing (for reading APK/DEX files)
dexlib2 = "2.5.2"

# Logging
slf4j = "2.0.13"

[libraries]
# ─── Ktor Server ────────────────────────────────────────────────────────────
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-gson = { module = "io.ktor:ktor-serialization-gson", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-default-headers = { module = "io.ktor:ktor-server-default-headers", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-sockets = { module = "io.ktor:ktor-server-sockets", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-tests = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# ─── Serialization ─────────────────────────────────────────────────────────
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# ─── HTTP Client ────────────────────────────────────────────────────────────
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# ─── DEX Processing ────────────────────────────────────────────────────────
dexlib2 = { module = "com.google.code.dexlib2:dexlib2", version.ref = "dexlib2" }

# ─── Kotlin Coroutines ──────────────────────────────────────────────────────
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# ─── Logging ───────────────────────────────────────────────────────────────
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# ─── CLI Argument Parsing ──────────────────────────────────────────────────
kotlinx-cli = { module = "org.jetbrains.kotlinx:kotlinx-cli", version.ref = "kotlinx-cli" }

[plugins]
# ─── Kotlin & Ktor Plugins ─────────────────────────────────────────────────
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
