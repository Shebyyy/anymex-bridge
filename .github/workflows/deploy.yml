name: Deploy to Server

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 120s
          script_stop: false
          script: |
            set -e
            echo "=== Deploying anymex-bridge (beta) ==="

            # Check prerequisites
            echo "[1/5] Checking prerequisites..."
            which git || { echo "ERROR: git not installed"; exit 1; }
            which java || { echo "ERROR: java not installed"; exit 1; }
            echo "OK: git, java available"

            # Clone or pull
            echo "[2/5] Fetching code..."
            if [ -d /root/anymex-bridge/.git ]; then
              cd /root/anymex-bridge
              git fetch origin beta
              git clean -fd
              git reset --hard origin/beta
            else
              rm -rf /root/anymex-bridge
              git clone -b beta https://github.com/Shebyyy/anymex-bridge.git /root/anymex-bridge
            fi
            echo "OK: code fetched"

            # Install deps
            echo "[3/5] Installing dependencies..."
            cd /root/anymex-bridge
            /root/.bun/bin/bun install
            echo "OK: deps installed"

            # Kill old process
            echo "[4/5] Restarting bridge..."
            kill $(cat /root/anymex-bridge/data/bridge.pid 2>/dev/null) 2>/dev/null || true
            pkill -f "bun.*index.ts" 2>/dev/null || true
            sleep 2

            # Start
            setsid /root/.bun/bin/bun run /root/anymex-bridge/index.ts > /root/anymex-bridge/data/bridge.log 2>&1 &
            echo $! > /root/anymex-bridge/data/bridge.pid
            sleep 5

            # Health check
            echo "[5/5] Health check..."
            if ss -tlnp | grep -q 3022; then
              echo "✅ Bridge is running on port 3022"
            else
              echo "❌ Bridge failed to start!"
              cat /root/anymex-bridge/data/bridge.log
              exit 1
            fi
